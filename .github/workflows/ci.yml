name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The toolchain version comes from rust-toolchain.toml.
      - name: Install Rust
        run: rustup component add rustfmt clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Format
        run: cargo fmt -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      # Includes tests/recipes.rs, which validates every recipe and image config.
      - name: Test
        run: cargo test --locked

  components:
    name: Components
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [absinit]
    defaults:
      run:
        working-directory: components/${{ matrix.component }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build for Absolution
        run: |
          rustup target add x86_64-unknown-redox
          cargo check --locked --target x86_64-unknown-redox

  shell:
    name: POSIX shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The build system's own scripts must run under any POSIX sh. Files
      # under recipes/ belong to the packages (some are vendored from other
      # projects), and recipe build scripts are bash by design.
      - name: Check scripts
        run: |
          scripts=$(git ls-files '*.sh' 'bin/*-pkg-config' | grep -v '^recipes/')
          for f in $scripts; do
            head -n 1 "$f" | grep -qx '#!/bin/sh' || { echo "$f: interpreter must be /bin/sh"; exit 1; }
            dash -n "$f"
          done
          shellcheck --shell=sh --severity=warning $scripts
