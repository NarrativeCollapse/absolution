name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The toolchain version comes from rust-toolchain.toml.
      - name: Install Rust
        run: rustup component add rustfmt clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Format
        run: cargo fmt -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      # Includes tests/recipes.rs, which validates every recipe and image config.
      - name: Test
        run: cargo test --locked

  shell:
    name: POSIX shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Standalone scripts must run under any POSIX sh. Recipe build scripts
      # are bash by design and are not checked here.
      - name: Check scripts
        run: |
          scripts=$(git ls-files '*.sh' 'bin/*-pkg-config' | grep -v '^recipes/wip/')
          for f in $scripts; do
            head -n 1 "$f" | grep -qx '#!/bin/sh' || { echo "$f: interpreter must be /bin/sh"; exit 1; }
            dash -n "$f"
          done
          shellcheck --shell=sh --severity=warning $scripts
