# Configuration for server stack demonstration

include = ["../server.toml"]

# General settings
[general]
# Filesystem size in MiB
filesystem_size = 4096

# Package settings
[packages]
# Daemons
openssh = {}
nginx = {}

# Backends
php84 = {}
composer = {}
luajit = {}
python312 = {}
# go = {}
# zig = {}

# Tools
nano = {}
neovim = {}
rsync = {}
vim = {}
sqlite3 = {}
# tmux = {}
htop = {}

# Content


[[files]]
path = "/usr/lib/init.d/98_keygen_sh"
data = """
requires_weak 10_net.target
bash /root/keygen.sh
"""

[[files]]
path = "/usr/lib/init.d/99_nginx.service"
data = """
[unit]
description = "nginx HTTP and reverse proxy server"
requires_weak = ["10_net.target"]

[service]
cmd = "/usr/bin/nginx"
args = ["-g", "daemon off;"]
type = "oneshot_async"
"""

[[files]]
path = "/usr/lib/init.d/99_sshd.service"
data = """
[unit]
description = "OpenSSH server"
requires_weak = ["10_net.target", "98_keygen_sh"]

[service]
cmd = "/usr/bin/sshd"
args = ["-D"]
type = "oneshot_async"
"""

[[files]]
path = "/usr/lib/init.d/99_php.service"
data = """
[unit]
description = "PHP built-in web server, behind nginx on port 8081"
requires_weak = ["10_net.target"]

[service]
# php-fpm does not work yet, so nginx proxies to PHP's built-in server.
cmd = "/usr/bin/php"
args = ["-S", "localhost:9000", "-t", "/var/www/html"]
envs = { PWD = "/var/www/html" }
type = "oneshot_async"
"""

[[files]]
path = "/var/www/default/index.html"
data = """
<!doctype html>
<title>Absolution</title>
<h1>Absolution</h1>
<p>nginx is serving this page from /var/www/default.
PHP is on port 8081.</p>
"""

[[files]]
path = "/var/www/html/index.php"
data = """
<?php

echo "Hello from PHP on Absolution!";
"""

[[files]]
path = "/var/www/html/phpinfo.php"
data = """
<?php phpinfo();
"""


[[files]]
path = "/var/www/html/README"
data = """
This is a demonstration into PHP server.

At the moment to run composer you have to run it like:
> php /bin/composer install
"""

[[files]]
postinstall = true
data = ""
path = "/etc/nginx/conf.d"
directory = true

[[files]]
postinstall = true
path = "/etc/nginx/nginx.conf"
data = """
user nginx;

# currently nginx does a lot spin locking for some reason
worker_processes 1;
error_log /var/log/nginx/error.log;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}
http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    include       mime.types;
    include       fastcgi.conf;
    default_type  application/octet-stream;

    include /etc/nginx/conf.d/*.conf;
}
"""

[[files]]
postinstall = true
path = "/etc/nginx/conf.d/localhost.conf"
data = """
server {
    listen       80;
    server_name  localhost;
    root   /var/www/default;
    absolute_redirect off;

    location / {
        index  index.html index.htm;
    }
}
"""

[[files]]
postinstall = true
path = "/etc/nginx/conf.d/php-www.conf"
data = """
server {
    listen 8081;
    server_name localhost;
    root /var/www/html;

    index index.php index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \\.php$ {
# PHP FPM does not work yet, see 99_php.service
#       include fastcgi_params;
#       fastcgi_pass 127.0.0.1:9000;
#       fastcgi_index index.php;
#       fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        proxy_pass http://127.0.0.1:9000;
    }
}
"""

[[files]]
postinstall = true
path = "/etc/php/84/php-fpm.conf"
data = """

error_log=/var/log/php-fpm.log
include=/etc/php/84/php-fpm.d/*.conf
"""

[[files]]
postinstall = true
path = "/etc/php/84/php-fpm.d/www.conf"
data = """
[www]
user = user
group = user
listen = 127.0.0.1:9000
pm = static
pm.max_children = 1
"""

[[files]]
postinstall = true
path = "/etc/ssh/sshd_config"
data = """
Port 22
AddressFamily inet
AuthorizedKeysFile	.ssh/authorized_keys
PermitRootLogin yes
PasswordAuthentication yes
PermitEmptyPasswords yes
Subsystem	sftp	/usr/libexec/sftp-server
"""

[users.nobody]
password = ""
shell = "/usr/bin/ion" #TODO: nologin?

[users.nginx]
password = ""
shell = "/usr/bin/ion" #TODO: nologin?

[[files]]
path = "/root/keygen.sh"
data = """
#!/usr/bin/env bash

if [ ! -f /etc/ssh/ssh_host_rsa_key ]; then
ssh-keygen -t rsa -f /etc/ssh/ssh_host_rsa_key -N ""
ssh-keygen -t ed25519 -f /etc/ssh/ssh_host_ed25519_key -N ""
ssh-keygen -t ecdsa -f /etc/ssh/ssh_host_ecdsa_key -N ""
fi
"""

[[files]]
path = "/home/user/server.sh"
data = """
#!/bin/sh
# Start the demo daemons by hand, if init did not.

/usr/bin/sshd -D &
/usr/bin/nginx -g "daemon off;" &
/usr/bin/php -S localhost:9000 -t /var/www/html &
"""

[[files]]
path = "/home/user/Welcome.txt"
data = """
##############################################################################
# Welcome to the Absolution server demo!
#
# This is a quick demonstration of Absolution used as a server stack.
# At the moment we support SSH, NGINX, Python, PHP. There's more to come
#
# This server demo is insecure by design, we encourage you to get familiar into
#   basics of server security if you wish to use this as a production server.
#
# init starts sshd, nginx and PHP at boot. If they are not running, start
#   them manually:
# > sudo sh server.sh
#
# The server will start port 22 (ssh), 80 (static web) and 8081 (php)
# If you use the build system, starting QEMU with `net=redir`
#   should expose those port to 8022, 8080 and 8081.
# Try logging in to console via SSH with `ssh user@localhost -p 8022`
#
##############################################################################
"""
