[package]
description = "Command-line tools and libraries for audio and video conversion"

[source]
tar = "https://ffmpeg.org/releases/ffmpeg-6.1.5.tar.xz"
blake3 = "da8e6743d96f27d5b5425339218f9a954d9440cb27ba449b449d686b411292e9"
patches = [
    "ffmpeg.patch",
]

[build]
template = "custom"
dependencies = [
    "zlib",
]
dev-dependencies = [
    "libstdcxx"
]
compiler = "gcc-no-lto"
script = """
DYNAMIC_INIT

ARCH="${TARGET%%-*}"
COOKBOOK_CONFIGURE_FLAGS=(
    --enable-cross-compile
    --target-os=redox
    --arch="${ARCH}"
    --cross_prefix="${TARGET}-"
    --prefix=/usr
    --disable-doc
    --enable-shared
    --disable-static
    --disable-network
    --disable-sdl2
    --disable-ffplay
    --enable-zlib
    --enable-pic
    --enable-encoder=png
    --enable-decoder=png
)
cookbook_configure
"""
